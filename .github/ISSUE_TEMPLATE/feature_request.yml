name: Feature
description: Propose one focused workflow capability
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "Use one issue per independently reviewable capability. Keep credentials and customer data out of this issue."
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What user or workflow outcome will this enable?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the required code, contracts, fixtures, and tests.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion checks.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Evidence and safety
      description: State data limits, fixture coverage, and why the change cannot auto-send outreach.
    validations:
      required: true
